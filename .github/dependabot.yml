version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 7
  # Matches `npmMinimalAgeGate` in .yarnrc.yml. Forge, its plugins and Vite are
  # pinned exactly, so each upgrade arrives as its own PR.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    ignore:
      # @types/node tracks the Node major bundled with the `electron` dependency.
      # Bump its major by hand when Electron moves to a newer Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
