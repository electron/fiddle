name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Called from release.yml, so tests gate every release.
  workflow_call:

permissions: {}

# A new push to a pull request cancels the run it supersedes. Pushes to main
# and release tags are never cancelled. Called from release.yml, the group is
# the release run's own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - run: git config --global core.autocrlf input
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      # Electron's install script and `yarn package` download the same zip.
      - name: Cache the Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: electron-${{ runner.os }}-
      # This job holds no secrets, so Electron's install script may run
      # (`dependenciesMeta.electron.built`); e2e tests need its binary.
      - name: Install dependencies
        run: yarn install --immutable
      # `git add -N` makes a generated file that was never committed show up in
      # the diff.
      - name: Generated source is up to date
        shell: bash
        run: |
          yarn generate
          git add --intent-to-add .
          git diff --exit-code
      # Missing or unused keys, placeholder, tag and plural mismatches, and the
      # translate script's own tests.
      - name: i18n catalogs
        shell: bash
        run: |
          yarn i18n:check
          yarn i18n:test
      - name: Lint
        run: yarn lint
      - name: Typecheck
        run: yarn typecheck
      - name: Unit tests
        run: yarn test
      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum yarn test:e2e
      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: yarn test:e2e
      # Unsigned: no signing variables are set here.
      - name: Package smoke test
        run: yarn package
      - name: Check that the e2e driver is not packaged
        run: node tools/release-check-asar.mjs packages/app/out

  identity:
    name: App identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
      # The identity must match the previous release, or its settings,
      # credentials and installs aren't found.
      - name: Check app identity
        run: node tools/release-identity.mjs

  # Upgrade test, disabled until it is implemented:
  #   1. Install the latest published release.
  #   2. Seed it with fixture data, including an encrypted token.
  #   3. Update to the candidate through Squirrel from a local feed.
  #   4. Verify the import and that the credentials decrypt.
  #   5. Update the candidate to candidate+1.
  # Once it works, drop `if: false`, add it to `gha-done`, and make the
  # release depend on it.
  upgrade-test:
    name: Upgrade test (${{ matrix.os }})
    if: false
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - run: echo "Upgrade test is not implemented yet" && exit 1

  gha-done:
    name: GitHub Actions Completed
    runs-on: ubuntu-latest
    needs:
      - test
      - identity
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: echo "All GitHub Actions jobs are done"
