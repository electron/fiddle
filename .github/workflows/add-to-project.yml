name: Add to Ecosystem WG Project

on:
  issues:
    types:
      - opened
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened

permissions: {}

jobs:
  add-to-project:
    # The project and its app credentials exist only in the electron org.
    if: github.repository_owner == 'electron'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        uses: electron/github-app-auth-action@5f70a3726af01b612f29aac96d05aa524389c9e9 # v2.1.0
        id: generate-token
        with:
          creds: ${{ secrets.ECOSYSTEM_ISSUE_TRIAGE_GH_APP_CREDS }}
          org: electron
      - name: Add to Project
        uses: dsanders11/project-actions/add-item@d5490cb5784c8570b072fbf02f974fd5ee3e145f # v2.1.0
        with:
          project-number: 89
          token: ${{ steps.generate-token.outputs.token }}
